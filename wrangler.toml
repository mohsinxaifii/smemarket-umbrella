# Cloudflare Pages project for www.smemarket.ae (the new site; the old live project "smemarket" is kept for rollback)
# Static site (Next.js export in out/) + Pages Functions in functions/ for the marketplace API.
name = "smemarket-site"
pages_build_output_dir = "out"
compatibility_date = "2024-11-01"

[vars]
# Emails listed here get the admin role on sign-up/login. Left EMPTY on purpose: sign-up doesn't verify
# email ownership, so anyone could claim a listed address first. Make an admin with SQL instead:
#   npx wrangler d1 execute smemarket --remote --command "UPDATE users SET role='admin' WHERE email='admin@smemarket.ae'"
ADMIN_EMAILS = ""

[[d1_databases]]
binding = "DB"
database_name = "smemarket"
# create with `npx wrangler d1 create smemarket`, then paste the id here
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
# private files: buyer ID documents and sellers' data-room documents. Never public.
binding = "FILES"
bucket_name = "smemarket-files"
